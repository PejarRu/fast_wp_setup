<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP Fast Setup - Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .wpf-tab { display: inline-block; padding: 10px; background: #f0f0f0; margin: 5px; cursor: pointer; }
        .wpf-tab.active { background: #007cba; color: white; }
        .wpf-tab-content { display: none; padding: 20px; border: 1px solid #ccc; margin-top: 10px; }
        .wpf-tab-content.active { display: block; }
    </style>
</head>
<body>
    <h1>WP Fast Setup - Test Page</h1>

    <div class="wpf-tabs">
        <div class="wpf-tab active" data-tab="site">Site</div>
        <div class="wpf-tab" data-tab="plugins">Plugins</div>
        <div class="wpf-tab" data-tab="content">Content</div>
    </div>

    <div id="site" class="wpf-tab-content active">
        <h2>Site Configuration</h2>
        <p>This is the site configuration tab.</p>
    </div>

    <div id="plugins" class="wpf-tab-content">
        <h2>Plugins</h2>
        <p>This is the plugins tab.</p>
    </div>

    <div id="content" class="wpf-tab-content">
        <h2>Content</h2>
        <p>This is the content tab.</p>
    </div>

    <script src="wp-fast-setup.js"></script>
</body>
</html>
